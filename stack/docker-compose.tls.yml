# TLS override for the MUCGPT stack (hop-by-hop encryption, see docs/TLS_ENCRYPTION.md).
#
# Note: `!override` is a Compose spec extension tag (Compose v2.24+) used to replace
# base-file port lists; YAML language servers may flag it as an unknown tag.
#
# Usage:
#   1. bash stack/tls/generate-dev-certs.sh
#   2. Trust stack/tls/certs/ca.crt in your browser/OS
#   3. podman compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
#
# Access:
#   - Frontend (via gateway):  https://localhost:9443
#   - Keycloak:                https://keycloak:8443  (hosts entry: keycloak -> 127.0.0.1)
#
# Every network hop is TLS:
#   browser --TLS--> gateway (terminates, re-encrypts) --TLS--> core / assistant / frontend / keycloak
#
# Remaining plaintext hops (documented, see docs/TLS_ENCRYPTION.md):
#   - init-keycloak -> keycloak:8100 (one-time bootstrap migration)
#   - postgres / valkey / xberg / mcpdoc-server (no TLS client config yet)
name: mucgpt-stack

x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "true"]
  interval: 30s
  timeout: 60s
  retries: 3
  start_period: 60s

services:
  keycloak:
    environment:
      - KC_HTTP_ENABLED=true # kept only for the one-time init-keycloak bootstrap migration
      - KC_HTTP_PORT=8100
      - KC_HTTPS_PORT=8443
      - KC_HTTPS_CERTIFICATE_FILE=/etc/certs/keycloak/tls.crt
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/etc/certs/keycloak/tls.key
    ports:
      - "8100:8100" # bootstrap migration only (plaintext, documented exception)
      - "8443:8443" # browser-facing TLS
    volumes:
      - ./tls/certs/keycloak:/etc/certs/keycloak:ro,Z

  refarch-gateway:
    ports: !override
      - "9443:8080" # browser-facing TLS
    environment:
      # --- server side: terminate browser TLS with the gateway leaf certificate ---
      - SERVER_SSL_CERTIFICATE=/etc/certs/gateway/tls.crt
      - SERVER_SSL_CERTIFICATE_PRIVATE_KEY=/etc/certs/gateway/tls.key
      - SERVER_SSL_ENABLED_PROTOCOLS=TLSv1.2,TLSv1.3
      # --- client side: re-encrypt every upstream hop, trust the internal CA ---
      - SPRING_SSL_BUNDLE_PEM_INTERNALCA_TRUSTSTORE_CERTIFICATE=file:/etc/certs/ca.crt
      - SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_HTTPCLIENT_SSL_SSLBUNDLE=internalca
      # --- routes now point at https upstreams ---
      - SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_ID=sso
      - SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_URI=https://keycloak:8443/
      - SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_PREDICATES_0=Path=/api/sso/userinfo
      - SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_FILTERS_0=RewritePath=/api/sso/userinfo, /auth/realms/local_realm/protocol/openid-connect/userinfo
      - SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_ID=backend
      - SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_URI=https://core-service:8000/
      - SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_PREDICATES_0=Path=/api/backend/**
      - SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_FILTERS_0=RewritePath=/api/backend/(?<urlsegments>.*), /api/$\{urlsegments}
      - SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_ID=assistant
      - SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_URI=https://assistant-service:8084/
      - SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_PREDICATES_0=Path=/api/assistant/**, /api/user/**, /api/directory/**, /api/admin/**
      - SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_ID=frontend
      - SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_URI=https://frontend:8443/
      - SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_PREDICATES_0=Path=/**
      # --- SSO: issuer is now the TLS endpoint the browser also uses ---
      - ALLOWED_ORIGINS_PUBLIC=https://localhost:*
      - ALLOWED_ORIGINS_CLIENTS=https://localhost:*
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI=https://keycloak:8443/auth/realms/local_realm
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_SSO_ISSUERURI=$${spring.security.oauth2.resourceserver.jwt.issuer-uri}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_PROVIDER=sso
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_CLIENTID=mucgpt
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_CLIENTSECRET=client_secret
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_SCOPE=openid,profile,roles,email,mucgpt-core
    volumes:
      - ./tls/certs/gateway:/etc/certs/gateway:ro,Z
      - ./tls/certs/ca.crt:/etc/certs/ca.crt:ro,Z
      # JVM default truststore + dev CA (generated by a one-shot container, see
      # docs/TLS_ENCRYPTION.md): the OAuth2 discovery fetch uses the JVM trust
      # store, not the Spring SSL bundle.
      - ./tls/certs/gateway-cacerts:/etc/pki/java/cacerts:ro,Z
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -k https://localhost:8080/actuator/health/liveness"]

  core-service:
    # TLS termination in the pod: uvicorn serves https://core-service:8000
    command: >-
      python -m uvicorn app:backend --host 0.0.0.0 --port 8000
      --ssl-certfile /etc/certs/core-service/tls.crt
      --ssl-keyfile /etc/certs/core-service/tls.key
    ports: !override []
    volumes:
      - ./tls/certs/core-service:/etc/certs/core-service:ro,Z
      - ./tls/certs/ca.crt:/etc/certs/ca.crt:ro,Z
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl --cacert /etc/certs/ca.crt https://localhost:8000/api/health"]

  assistant-service:
    command: >-
      python -m uvicorn app:backend --host 0.0.0.0 --port 8084
      --ssl-certfile /etc/certs/assistant-service/tls.crt
      --ssl-keyfile /etc/certs/assistant-service/tls.key
    ports: !override []
    volumes:
      - ./tls/certs/assistant-service:/etc/certs/assistant-service:ro,Z
      - ./tls/certs/ca.crt:/etc/certs/ca.crt:ro,Z
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl --cacert /etc/certs/ca.crt https://localhost:8084/api/health"]

  frontend:
    # TLS termination in the pod: nginx serves https://frontend:8443 and proxies
    # to the baked-in HTTP server on loopback (no network hop, see docs).
    ports: !override []
    volumes:
      - ./tls/frontend-tls.conf:/opt/app-root/etc/nginx.d/zzz-tls.conf:ro,Z
      - ./tls/certs/frontend:/etc/certs/frontend:ro,Z
