[project]
name = "mucgpt-assistant-service-migrations"
version = "0.9.0"
description = "Migrations for mucgpt-assistant-service"
authors = [
    { name = "Michael Jaumann", email = "michael.jaumann@muenchen.de" },
    { name = "Paul Ilitz", email = "paul.ilitz@muenchen.de" },
]
maintainers = [
    { name = " ITM KIES", email = "ki@muenchen.de" },
    { name = "Michael Jaumann", email = "michael.jaumann@muenchen.de" },
    { name = "Paul Ilitz", email = "paul.ilitz@muenchen.de" },
]
requires-python = ">=3.13"
dependencies = [
    "alembic==1.18.5",
    "asyncpg==0.31.0",
    "psycopg2-binary==2.9.13",
    "pydantic-settings[yaml]==2.14.2",
    "sqlalchemy==2.0.57",
]

[dependency-groups]
dev = [
    "ty==0.0.99",
]

[[tool.uv.index]]
name = "pypy"
url = "https://pypi.org/simple"
