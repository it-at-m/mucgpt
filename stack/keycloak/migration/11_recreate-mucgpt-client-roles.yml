id: recreate_mucgpt_client_roles
author: Default
realm: local_realm
changes:
  - addRole:
      name: mucgpt-user
      description: Example role with read access to application data
      clientRole: true
      clientId: mucgpt
      composite: false

  - addRole:
      name: mucgpt-admin
      description: Administrative role for MUCGPT management features
      clientRole: true
      clientId: mucgpt
      composite: false

  - assignRole:
      user: demo-user
      role: mucgpt-user
      clientId: mucgpt

  - assignRole:
      user: demo-team-a-user
      role: mucgpt-user
      clientId: mucgpt

  - assignRole:
      user: demo-team-b-user
      role: mucgpt-user
      clientId: mucgpt

  - assignRole:
      user: demo-admin
      role: mucgpt-admin
      clientId: mucgpt
