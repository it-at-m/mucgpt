# TLS server block for the MUCGPT frontend (used by stack/docker-compose.tls.yml).
#
# Terminates TLS on :8443 and proxies to the baked-in plain HTTP server on the
# container's loopback interface. The loopback hop stays inside the container
# (not a network hop between pods), so no plaintext traffic leaves the pod.
#
# Mounted read-only into the nginx include directory of the ubi9 nginx image
# (NGINX_DEFAULT_CONF_PATH, default /opt/app-root/etc/nginx.d/).

server {
    listen 8443 ssl;
    server_name frontend;

    ssl_certificate     /etc/certs/frontend/tls.crt;
    ssl_certificate_key /etc/certs/frontend/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
