id: add_mucgpt_core_scope
author: Default
realm: local_realm
changes:
  - addClientScope:
      name: mucgpt-core
      displayOnConsentScreen: false
      includeInTokenScope: true
      protocolMappers:
        - name: user_id
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          config:
            claim.name: "user_id"
            user.attribute: "user_id"
            userinfo.token.claim: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            aggregate.attrs: "false"
            multivalued: "false"
        - name: organization_unit
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          config:
            claim.name: "organization_unit"
            user.attribute: "organization_unit"
            userinfo.token.claim: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            aggregate.attrs: "false"
            multivalued: "false"

  - assignDefaultClientScope:
      clientId: mucgpt
      clientScopeName: mucgpt-core
