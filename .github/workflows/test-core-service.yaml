name: Core service test
permissions:
  contents: read

on: [push, workflow_dispatch]

jobs:
  test_package:
    name: Test ${{ matrix.os }} Python ${{ matrix.python_version }}
    runs-on: ${{ matrix.os }}
    env:
      MUCGPT_LIFECYCLE_POSTGRES_HOST: 127.0.0.1
      MUCGPT_LIFECYCLE_POSTGRES_PORT: 5432
      MUCGPT_LIFECYCLE_POSTGRES_USER: admin
      MUCGPT_LIFECYCLE_POSTGRES_PASSWORD: admin
    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04"]
        python_version: ["3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          architecture: x64
      - name: Install dependencies
        run: |
          cd ./mucgpt-core-service
          uv sync --all-extras
      - name: Lint with ruff
        run: |
          cd ./mucgpt-core-service
          uv run ruff check .
      - name: Run Python tests
        run: |
          cd ./mucgpt-core-service
          uv run pytest
