name: Core service test
permissions:
  contents: read

on: [push, workflow_dispatch]

jobs:
  test_package:
    name: Test ${{ matrix.os }} Python ${{ matrix.python_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04"]
        # Must match the .python-version files (exact pin).
        python_version: ["3.13.18"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          architecture: x64
          python-version: "3.13.18"
      - name: Install dependencies
        run: |
          cd ./mucgpt-core-service
          uv sync --all-extras
      - name: Lint with ruff
        run: |
          cd ./mucgpt-core-service
          uv run ruff check .
      - name: Run Python tests
        run: |
          cd ./mucgpt-core-service
          uv run pytest

  ty_check:
    name: Type check (ty) — core-service
    runs-on: ["ubuntu-22.04"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          architecture: x64
          python-version: "3.13.18"
      - name: Install dependencies
        run: |
          cd ./mucgpt-core-service
          uv sync --all-extras
      - name: Type check with ty
        run: |
          cd ./mucgpt-core-service
          uv run ty check
