name: build
on:
  pull_request:
  schedule:
    - cron: "0 3 * * *" # daily default-branch scan so Trivy coverage is tracked in the Security tab
permissions:
  contents: read
  security-events: write # SARIF upload to the Security tab
jobs:
  build:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Run Trivy Security check on Repository
        uses: "it-at-m/lhm_actions/action-templates/actions/action-trivy@03f09fa81a60371c01caf1a9deada89ceebbd5e5" # v1.6.3
