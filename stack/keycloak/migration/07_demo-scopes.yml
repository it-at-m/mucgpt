id: demo_scopes
author: Default
realm: local_realm
changes:
  - addClientScope:
      name: demo
      displayOnConsentScreen: false
      includeInTokenScope: true
      protocolMappers:
        - name: email
          protocol: openid-connect
          protocolMapper: oidc-usermodel-property-mapper
          config:
            claim.name: "email"
            user.attribute: "email"
            userinfo.token.claim: "true"
            id.token.claim: "true"
            access.token.claim: "true"
        - name: surname
          protocol: openid-connect
          protocolMapper: oidc-usermodel-property-mapper
          config:
            claim.name: "surname"
            user.attribute: "lastName"
            userinfo.token.claim: "true"
            id.token.claim: "true"
            access.token.claim: "false"
        - name: givenname
          protocol: openid-connect
          protocolMapper: oidc-usermodel-property-mapper
          config:
            claim.name: "givenname"
            user.attribute: "firstName"
            userinfo.token.claim: "true"
            id.token.claim: "true"
            access.token.claim: "false"
        - name: username
          protocol: openid-connect
          protocolMapper: oidc-usermodel-property-mapper
          config:
            claim.name: "username"
            user.attribute: "username"
            userinfo.token.claim: "true"
            id.token.claim: "true"
            access.token.claim: "true"
        - name: displayName
          protocol: openid-connect
          protocolMapper: oidc-usermodel-property-mapper
          config:
            claim.name: "displayName"
            user.attribute: "username"
            userinfo.token.claim: "true"
            id.token.claim: "true"
            access.token.claim: "false"
        - name: user_id
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          config:
            claim.name: "user_id"
            user.attribute: "user_id"
            userinfo.token.claim: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            aggregate.attrs: "false"
            multivalued: "false"
        - name: organization_unit
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          config:
            claim.name: "organization_unit"
            user.attribute: "organization_unit"
            userinfo.token.claim: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            aggregate.attrs: "false"
            multivalued: "false"
  - addClientScope:
      name: demo_extended
      displayOnConsentScreen: false
      includeInTokenScope: true
      protocolMappers:
        - name: client roles
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          config:
            claim.name: "memberof"
            user.attribute: "memberof"
            userinfo.token.claim: "true"
            id.token.claim: "true"
            access.token.claim: "false"
            jsonType.label: "String"
            aggregate.attrs: "false"
            multivalued: "true"
  # assign optional scopes to client
  - assignDefaultClientScope:
      clientId: mucgpt
      clientScopeName: demo
  - assignOptionalClientScope:
      clientId: mucgpt
      clientScopeName: demo_extended
