name: Build and Release Migrations Docker Image
permissions:
  contents: read

on:
  push:
    tags:
      - "mucgpt-assistant-migrations-*" # Triggers only on mucgpt-assistant-migrations tags
  workflow_dispatch: # Allows manual triggering of the workflow
    inputs:
      tag:
        description: "Migrations tag to release (e.g., mucgpt-assistant-migrations-1.0.0)"
        required: true
        default: "mucgpt-assistant-migrations-latest"

jobs:
  build-and-push-assistant-migrations-service:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      packages: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Record checked-out commit
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version from mucgpt-assistant-migrations tag
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            FULL_TAG="${{ github.event.inputs.tag }}"
          else
            FULL_TAG=${GITHUB_REF#refs/tags/}
          fi

          # Extract version from mucgpt-assistant-migrations-* tag (e.g., mucgpt-assistant-migrations-1.0.0 -> 1.0.0)
          if [[ "$FULL_TAG" =~ ^mucgpt-assistant-migrations-(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "Error: Tag must start with 'mucgpt-assistant-migrations-'"
            exit 1
          fi

          echo "full_tag=${FULL_TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "repo_lowercase=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Check for an existing GitHub Release
        id: existing-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.full_tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set build timestamp
        id: build_ts
        run: echo "BUILD_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build and push mucgpt-assistant-migrations Docker image
        if: steps.existing-release.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./mucgpt-assistant-service-migrations
          file: ./mucgpt-assistant-service-migrations/Dockerfile
          push: true
          sbom: true
          provenance: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo_lowercase }}/mucgpt-assistant-migrations:${{ steps.vars.outputs.version }}
            ghcr.io/${{ steps.vars.outputs.repo_lowercase }}/mucgpt-assistant-migrations:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            IMAGE_CREATED=${{ github.event.repository.pushed_at || env.BUILD_TS }}
            IMAGE_REVISION=${{ steps.revision.outputs.sha }}
            IMAGE_VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ steps.revision.outputs.sha }}
            VERSION=${{ steps.vars.outputs.version }}
      - name: Image digest
        if: steps.existing-release.outputs.exists != 'true'
        run: |
          echo "mucgpt-assistant-migrations image built and pushed:"
          echo "  ghcr.io/${{ github.repository }}/mucgpt-assistant-migrations:${{ steps.vars.outputs.version }}"
          echo "  ghcr.io/${{ github.repository }}/mucgpt-assistant-migrations:latest"
      - name: Create GitHub Release
        if: steps.existing-release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.full_tag }}
          VERSION: ${{ steps.vars.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ steps.vars.outputs.repo_lowercase }}/mucgpt-assistant-migrations
        run: |
          notes=$(cat <<EOF
          ## Container image

          \`$IMAGE:$VERSION\`

          Digest: \`$DIGEST\`
          EOF
          )

          gh release create "$TAG" \
            --verify-tag \
            --title "Assistant migrations $VERSION" \
            --generate-notes \
            --notes "$notes"
