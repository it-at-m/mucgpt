name: Build and Release Core Docker Image
permissions:
  contents: read

on:
  push:
    tags:
      - "mucgpt-core-*" # Triggers only on mucgpt-core tags
  workflow_dispatch: # Allows manual triggering of the workflow
    inputs:
      tag:
        description: "Core tag to release (e.g., mucgpt-core-1.0.0)"
        required: true
        default: "mucgpt-core-latest"

jobs:
  build-and-push-core-service:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      packages: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Record checked-out commit
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version from mucgpt-core tag
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            FULL_TAG="${{ github.event.inputs.tag }}"
          else
            FULL_TAG=${GITHUB_REF#refs/tags/}
          fi

          # Extract version from mucgpt-core-* tag (e.g., mucgpt-core-1.0.0 -> 1.0.0)
          if [[ "$FULL_TAG" =~ ^mucgpt-core-(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "Error: Tag must start with 'mucgpt-core-'"
            exit 1
          fi

          echo "full_tag=${FULL_TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "repo_lowercase=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Check for an existing GitHub Release
        id: existing-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.full_tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set build timestamp
        id: build_ts
        run: echo "BUILD_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build and push mucgpt-core Docker image
        if: steps.existing-release.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./mucgpt-core-service
          file: ./mucgpt-core-service/Dockerfile
          push: true
          sbom: true
          provenance: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo_lowercase }}/mucgpt-core:${{ steps.vars.outputs.version }}
            ghcr.io/${{ steps.vars.outputs.repo_lowercase }}/mucgpt-core:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            IMAGE_CREATED=${{ github.event.repository.pushed_at || env.BUILD_TS }}
            IMAGE_REVISION=${{ steps.revision.outputs.sha }}
            IMAGE_VERSION=${{ steps.vars.outputs.version }}
      - name: Image digest
        if: steps.existing-release.outputs.exists != 'true'
        run: |
          echo "mucgpt-core image built and pushed:"
          echo "  ghcr.io/${{ github.repository }}/mucgpt-core:${{ steps.vars.outputs.version }}"
          echo "  ghcr.io/${{ github.repository }}/mucgpt-core:latest"
      - name: Create GitHub Release
        if: steps.existing-release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.full_tag }}
          VERSION: ${{ steps.vars.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ steps.vars.outputs.repo_lowercase }}/mucgpt-core
          OPENCODE_IMAGE: registry.opencode.de/landeshauptstadt-muenchen/mucgpt/mucgpt-core
        run: |
          notes=$(cat <<EOF
          ## Container image

          \`$IMAGE:$VERSION\`

          Also available at \`$OPENCODE_IMAGE:$VERSION\`

          Digest: \`$DIGEST\`
          EOF
          )

          gh release create "$TAG" \
            --verify-tag \
            --title "Core service $VERSION" \
            --generate-notes \
            --notes "$notes"
      - name: Log in to openCode container registry
        if: steps.existing-release.outputs.exists != 'true'
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.opencode.de
          username: ${{ secrets.OPENCODE_REGISTRY_USERNAME }}
          password: ${{ secrets.OPENCODE_REGISTRY_TOKEN }}
      - name: Push image to openCode container registry
        if: steps.existing-release.outputs.exists != 'true'
        continue-on-error: true
        env:
          SOURCE: ghcr.io/${{ steps.vars.outputs.repo_lowercase }}/mucgpt-core@${{ steps.build.outputs.digest }}
          OPENCODE_IMAGE: registry.opencode.de/landeshauptstadt-muenchen/mucgpt/mucgpt-core
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          TAGS=("$OPENCODE_IMAGE:$VERSION")
          if [ "$VERSION" != "latest" ]; then
            TAGS+=("$OPENCODE_IMAGE:latest")
          fi
          ARGS=()
          for tag in "${TAGS[@]}"; do
            ARGS+=(-t "$tag")
          done
          docker buildx imagetools create "${ARGS[@]}" "$SOURCE"
          echo "Copied image to openCode container registry:"
          printf '  %s\n' "${TAGS[@]}"
